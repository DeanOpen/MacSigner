[package]
name = "macsigner-app"
version = "0.3.0"
description = "MacSigner — ký số PDF, ESIGN và CTSIGN (Tauri)"
edition = "2024"

[lib]
name = "macsigner_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The signing core (ESIGN, CTSIGN, PDF, Windows store).
macsigner = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
anyhow = "1"
pcsc = "2.9"
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
