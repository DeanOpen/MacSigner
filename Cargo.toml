[package]
name = "macsigner"
version = "0.2.0"
edition = "2024"
description = "ESIGN + CTSIGN signing helpers merged into one Rust desktop application"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:hayro"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
cryptoki = "0.12.1"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = "1"
# PDF page rendering for the legacy egui UI only; the Tauri app previews with pdf.js.
hayro = { version = "0.8", features = ["embed-fonts"], optional = true }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.38", default-features = false }
p12-keystore = "0.3.2"
pcsc = "2.9.0"
rfd = { version = "0.15", optional = true }
rpassword = "7"
rsa = { version = "0.9", features = ["pem", "sha1", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
ttf-parser = "0.25"
tower-http = { version = "0.6", features = ["cors", "limit"] }
tungstenite = "0.30"
x509-parser = "0.18.1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# Independent parser for checking signed PDFs in tests.
hayro = { version = "0.8", features = ["embed-fonts"] }
http-body-util = "0.1"
rand = "0.8"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
