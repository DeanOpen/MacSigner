[package]
name = "macsigner-token-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
cryptoki = "0.12.1"
hex = "0.4"
rsa = { version = "0.9", features = ["pem", "sha1", "sha2"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-parser = "0.18.1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
lto = "thin"
strip = true
